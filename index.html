<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KODIGO URBAN</title><meta name="theme-color" content="#0a1428">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8fd;--ink:#0a1428;--ac:#1d4ed8;--bg2:#e5ebf6;--ln:#d3dbec;--mu:#5d6a85;--tx:var(--ink);--wa:#14a44d;--pp:#ffc439;--hd:'Anton','Impact',sans-serif;--bd:'Inter',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@supports(color:color-mix(in srgb,red,blue)){:root{--bg2:color-mix(in srgb,var(--ink) 7%,var(--bg));--ln:color-mix(in srgb,var(--ink) 14%,var(--bg));--mu:color-mix(in srgb,var(--ink) 58%,var(--bg))}}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 var(--bd);padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;overflow-x:hidden}
html.lock,html.lock body{overflow:hidden}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font:inherit;color:inherit;cursor:pointer}button,a,input,label,select{touch-action:manipulation}
.ann{background:var(--ac);color:#fff;overflow:hidden;white-space:nowrap;font:600 11px var(--bd);letter-spacing:.18em;text-transform:uppercase}
.ann div{display:inline-block;padding:9px 0;animation:mq 34s linear infinite}.ann span{margin:0 26px}.ann span::after{content:"✦";margin-left:52px;opacity:.7}
@keyframes mq{to{transform:translateX(-50%)}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px;background:var(--ink);color:#fff}
header.top svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hb,.hr a{display:grid;place-items:center;width:44px;height:44px;border:0;background:none;color:#fff;position:relative}
.hr{display:flex;justify-content:flex-end}
#logo{display:block;padding:4px 6px;user-select:none;-webkit-user-select:none}#logo img{height:34px;width:auto;filter:drop-shadow(0 0 0 transparent)}
.hc .bdg{top:3px;right:2px;border-color:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding:30px 16px}.narrow{max-width:720px}
.sh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}.sh span{font:600 13px var(--bd);color:var(--mu)}
.st{font:400 clamp(28px,6vw,46px)/1 var(--hd);text-transform:uppercase;margin:0 0 16px;letter-spacing:.01em}.sh .st{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:15px 28px;font:700 13px var(--bd);letter-spacing:.1em;text-transform:uppercase;transition:transform .2s,background .25s,color .25s,box-shadow .25s}
.btn:hover{background:var(--ac);transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.acc{background:var(--ac)}.btn.acc:hover{background:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.wa{background:var(--wa)}.btn.wa:hover{background:#0f8a40}
.btn.pp{background:var(--pp);color:#0a1428}.btn.pp:hover{background:#f2b11d}
.btn:disabled{opacity:.5;pointer-events:none}.btn.full,.sheet .btn,.wrap .btn.wa{width:100%;margin-top:10px}
/* Banners */
.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;height:min(80vh,660px);height:min(80svh,660px);min-height:440px;border-radius:0 0 30px 30px;touch-action:pan-y}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}.slide.on{opacity:1;visibility:visible;z-index:1}
.slide picture{position:absolute;inset:0;display:block}
.bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translate3d(var(--bx,0px),var(--by,0px),0) scale(1.06);transition:transform .25s ease-out}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72));pointer-events:none}
.bcopy{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:0 20px 46px;max-width:760px}
.eyb{display:inline-block;font:700 11px var(--bd);letter-spacing:.2em;border:1px solid rgba(255,255,255,.6);border-radius:99px;padding:5px 12px;margin-bottom:14px}
.bcopy h1{font:400 clamp(36px,11.5vw,110px)/.95 var(--hd);text-transform:uppercase;margin:0 0 12px;overflow-wrap:break-word}
.bcopy p{margin:0 0 20px;font-size:15px;color:#eef;max-width:420px}
.slide.on .bcopy>*{animation:rise .8s both}.slide.on .bcopy>:nth-child(2){animation-delay:.1s}.slide.on .bcopy>:nth-child(3){animation-delay:.2s}.slide.on .bcopy>:nth-child(4){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.bcopy .btn{background:var(--ac)}.bcopy .btn:hover{background:#fff;color:var(--ink)}
.dots{position:absolute;z-index:3;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}.dots button{width:9px;height:9px;border-radius:99px;border:0;background:rgba(255,255,255,.45);padding:0;transition:.3s}.dots button.on{width:26px;background:#fff}
.b3d{position:absolute;inset:0;perspective:900px;background:radial-gradient(circle at 75% 30%,var(--ac) 0,#10246b 34%,var(--ink) 68%)}
.b3d i{position:absolute;border:2px solid rgba(255,255,255,.35);border-radius:18px;animation:fl 12s ease-in-out infinite}
.b3d i:nth-child(1){width:46vmin;height:46vmin;right:6%;top:8%}.b3d i:nth-child(2){width:28vmin;height:28vmin;right:34%;top:30%;animation-delay:-4s;border-color:rgba(255,255,255,.2)}.b3d i:nth-child(3){width:15vmin;height:15vmin;right:10%;top:46%;animation-delay:-8s;background:rgba(255,255,255,.14)}
@keyframes fl{0%,100%{transform:rotateX(55deg) rotateZ(0) translateY(0)}50%{transform:rotateX(55deg) rotateZ(180deg) translateY(-18px)}}
.band{background:var(--ink);overflow:hidden;white-space:nowrap;padding:16px 0;margin-top:26px}.band div{display:inline-block;animation:mq 46s linear infinite}.band img{display:inline-block;height:40px;width:auto;margin:0 34px;vertical-align:middle;opacity:.95}.band i{color:var(--ac);font-style:normal;font-size:26px;vertical-align:middle}
/* Categorías */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:180px;padding:18px;border-radius:22px;background:var(--ink);color:#fff;overflow:hidden;transition:transform .2s ease-out;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.tile:nth-child(4n+2){background:var(--ac)}.tile:nth-child(4n+3){background:var(--bg2);color:var(--ink)}.tile:nth-child(4n+4){background:#fff;color:var(--ink)}
.tile em{position:absolute;top:16px;left:18px;font:600 12px var(--bd);font-style:normal;opacity:.7}.tile b{font:400 clamp(20px,5.2vw,38px)/1.05 var(--hd);text-transform:uppercase;overflow-wrap:anywhere}.tile small{opacity:.7;font-size:12px}.tile span{position:absolute;top:10px;right:16px;font-size:26px;transition:transform .3s}.tile:hover span{transform:translate(4px,-4px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:8px 16px;font:600 13px var(--bd);transition:.2s;display:inline-block;color:var(--ink)}.chip.on,.chip:hover{background:var(--ink);color:#fff}.chip.dng:hover{background:#d32020;border-color:#d32020;color:#fff}
.chips.sub .chip{border-color:var(--ln);font-size:12px;padding:6px 13px}.chips.sub .chip.on{background:var(--ac);border-color:var(--ac)}
/* Productos */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}
.card{position:relative;cursor:pointer}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.reveal{opacity:0;transition:opacity .7s}.reveal.in{opacity:1}
.ph{position:relative;aspect-ratio:4/5;background:var(--bg2);border-radius:16px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s,opacity .4s}.ph img.b{opacity:0}
@media(hover:hover){.card:hover .ph img.a{transform:scale(1.05)}.card:hover .ph img.b{opacity:1}}
.heart{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;transition:transform .2s;z-index:3;color:var(--ink);padding:0}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;pointer-events:none}
.heart.on svg{fill:var(--ac);stroke:var(--ac)}.heart:active{transform:scale(.85)}.heart.inl{position:static;background:var(--bg2);flex:none}
.tag{position:absolute;left:10px;top:10px;background:var(--ink);color:#fff;font:700 10px var(--bd);padding:4px 9px;border-radius:99px;letter-spacing:.12em;z-index:2}
.meta{padding:10px 2px 0}.meta h3{margin:0 0 2px;font:600 14px/1.3 var(--bd)}.meta div{display:flex;gap:8px;align-items:baseline;justify-content:space-between}.meta b{font:700 15px var(--bd)}.meta small{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.empty{color:var(--mu);padding:30px 0}.note{color:var(--mu);font-size:13px}.warn{color:#b45309;background:#fef3c7;border-radius:10px;padding:10px 12px}
#view.vin{animation:vin .4s ease both}@keyframes vin{from{opacity:0;transform:translateY(12px)}}
/* Barra inferior */
.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(0) scale(1);display:flex;gap:2px;background:var(--ink);border-radius:999px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:transform .65s cubic-bezier(.34,1.56,.64,1),opacity .35s;will-change:transform}
.tabbar.hide{transform:translateX(-50%) translateY(160%) scale(.7);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.6,0,.9,.4),opacity .3s}
.tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 15px;border-radius:999px;font:600 10.5px var(--bd);color:#9db0d6;transition:.25s;letter-spacing:.04em}.tabbar a.on{background:var(--ac);color:#fff}
.tabbar:not(.hide) a{animation:tin .6s cubic-bezier(.34,1.56,.64,1) both}.tabbar a:nth-child(2){animation-delay:.07s}.tabbar a:nth-child(3){animation-delay:.14s}.tabbar a:nth-child(4){animation-delay:.21s}
@keyframes tin{from{opacity:0;transform:translateY(22px) scale(.55) rotateX(70deg)}}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bdg{position:absolute;top:1px;right:6px;background:var(--ac);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--ink);font-weight:700}.bdg[hidden]{display:none}.tabbar a.on .bdg{background:#fff;color:var(--ink)}
/* Menú lateral */
#drawer{position:fixed;inset:0;z-index:70;background:rgba(10,20,40,.6);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}#drawer.open{opacity:1;visibility:visible}
.dsh{position:absolute;left:0;top:0;bottom:0;width:min(86vw,360px);background:var(--bg);padding:70px 22px 30px;overflow:auto;transform:translateX(-100%);transition:transform .4s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}#drawer.open .dsh{transform:none}
.dsh nav{display:grid;gap:4px}.dsh nav>a,.dh{display:block;padding:12px 0;font:400 24px var(--hd);text-transform:uppercase;border-bottom:1px solid var(--ln)}.ds{display:block;padding:8px 0 8px 14px;color:var(--mu);font-weight:600;font-size:14px}.dg{border-bottom:1px solid var(--ln);padding-bottom:6px}.dg .dh{border:0;padding-bottom:4px}
.mx{position:absolute;right:22px;top:22px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.dsh .mx{left:18px;right:auto;background:var(--bg2);box-shadow:none}
/* Ventana de producto */
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.72);display:none;align-items:flex-end;justify-content:center;perspective:1200px}#modal.open{display:flex}#modal:not(.open){display:none!important}
.sheet{position:relative;background:var(--bg);border-radius:26px 26px 0 0;width:min(960px,100%);max-height:94vh;max-height:94svh;overflow:auto;overscroll-behavior:contain;display:grid;grid-template-columns:1fr;gap:0;padding:0 0 calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.enter{animation:sheet .5s cubic-bezier(.2,.9,.25,1)}@keyframes sheet{from{transform:translateY(60px) rotateX(14deg);opacity:0}}
.gal{position:relative;display:flex;flex-direction:column}
.gmain{flex:1;position:relative;width:100%;aspect-ratio:4/5;max-height:70vh;max-height:70svh;background:var(--bg2);touch-action:pan-y;cursor:zoom-in;overflow:hidden}.gmain img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gtop{position:absolute;left:14px;top:14px;display:flex;gap:8px;z-index:2;pointer-events:none}.cnt,.zm{background:rgba(10,20,40,.72);color:#fff;font:600 11px var(--bd);padding:4px 10px;border-radius:99px}
.thumbs{position:absolute;left:12px;right:12px;bottom:12px;gap:6px;display:flex;overflow-x:auto;scrollbar-width:none}.thumbs::-webkit-scrollbar{display:none}
.thumbs img{width:48px;height:58px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.55);opacity:.85;cursor:pointer;flex:none}.thumbs img.on{border-color:#fff;opacity:1}
.info{padding:18px 18px 4px}.info small{color:var(--mu);text-transform:uppercase;letter-spacing:.12em;font-size:11px}.info h2{font:400 clamp(26px,5vw,36px)/1.05 var(--hd);margin:4px 0 8px;text-transform:uppercase}.prrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.pr{font:700 24px var(--bd)}.sz{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duo .btn{margin-top:10px;padding-left:10px;padding-right:10px}
.wasel{display:flex;align-items:center;gap:10px;margin:12px 0 0;font:600 12px var(--bd);color:var(--mu)}.wasel select{flex:1;background:#fff;border:1.5px solid var(--ln);border-radius:12px;padding:11px 12px;font:600 14px var(--bd);color:var(--ink)}
/* Visor */
#lb{position:fixed;inset:0;z-index:120;background:#000;animation:lbin .3s ease both}@keyframes lbin{from{opacity:0;transform:scale(1.04)}}
.lbs{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none;cursor:zoom-in;user-select:none;-webkit-user-select:none}
.lbs img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:transform .2s ease-out;will-change:transform;-webkit-user-drag:none}
.lbx{position:absolute;z-index:3;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:18px}
.lbc{position:absolute;z-index:3;left:16px;top:calc(26px + env(safe-area-inset-top,0px));color:#fff;font:600 13px var(--bd);letter-spacing:.08em}
.lbn{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:30px;line-height:1}.lbn.p{left:14px}.lbn.n{right:14px}
.lbh{position:absolute;z-index:3;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.65);font-size:12px;margin:0;pointer-events:none;padding:0 16px}
/* Carrito / pago */
.qty{display:inline-flex;align-items:center;gap:12px;margin:6px 0}.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:transparent}.qty.big{margin:8px 0}
.line{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}.line img{width:76px;height:92px;object-fit:cover;border-radius:12px}.li{flex:1}.li h4{margin:0}.li small{color:var(--mu)}.lr{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}.x{background:none;border:0;color:var(--mu)}
.tot{display:flex;justify-content:space-between;font:400 28px var(--hd);padding:18px 0;text-transform:uppercase}
.box{background:#fff;border:1.5px solid var(--ln);border-radius:20px;padding:18px;margin:14px 0}.box h3{margin:0 0 10px;font:400 22px var(--hd);text-transform:uppercase}
.meths{display:grid;gap:10px}.meth{display:flex;gap:12px;align-items:center;border:1.5px solid var(--ln);border-radius:14px;padding:13px 14px;cursor:pointer;background:#fff;transition:.2s}.meth:has(input:checked){border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}.meth input{width:auto;accent-color:var(--ac)}.meth b{display:block}.meth small{color:var(--mu)}
.big-total{font:400 54px/1 var(--hd);color:var(--ac);margin:4px 0}.code{display:inline-block;font:700 18px var(--bd);letter-spacing:.1em;background:var(--bg2);border-radius:10px;padding:6px 12px}
.row{display:flex;gap:8px}.row input{flex:1}.copyb{border:1.5px solid var(--ln);background:#fff;border-radius:10px;padding:6px 12px;font:600 12px var(--bd);margin-left:6px}
.ok{background:#dcfce7;color:#14532d;border-radius:12px;padding:12px 14px;font-weight:600}
input,select,textarea{width:100%;background:#fff;color:var(--tx);border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;font:inherit;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=color]{padding:3px;height:46px;width:70px;cursor:pointer}input[type=checkbox],input[type=radio]{width:auto}
.sbox input{font-size:18px;padding:16px 20px;border-radius:999px}
/* Pie */
footer{margin-top:40px;background:var(--ink);color:#fff;border-radius:30px 30px 0 0;padding:44px 20px 30px;text-align:center}
#flogo{width:min(78vw,460px);height:auto;margin:0 auto 22px;user-select:none;-webkit-user-select:none}
.pays{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.pays span{border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:5px 14px;font:600 11px var(--bd);letter-spacing:.1em;text-transform:uppercase;color:#cdd8f2}
.copy{color:#8fa3cf;font-size:12px;margin:10px 0 0}footer .btn.wa{width:auto;margin:0}
/* Panel admin */
.adm{max-width:960px;margin:0 auto;padding:20px 16px}.admbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:10px}.admbar h2{font:400 26px var(--hd);margin:0;text-transform:uppercase}.admbar>div{display:flex;gap:8px;flex-wrap:wrap}
.atabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}.atabs::-webkit-scrollbar{display:none}.atabs .chip{white-space:nowrap}
.login{max-width:380px;margin:40px auto;background:#fff;border:1.5px solid var(--ln);border-radius:22px;padding:24px;display:grid;gap:12px}.login h2{font:400 26px var(--hd);margin:0;text-transform:uppercase}
.pw{position:relative}.pw input{padding-right:84px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font:700 12px var(--bd);color:var(--mu);padding:10px}
.form{display:grid;gap:14px}.form label,.lab{display:grid;gap:6px;font:600 13px var(--bd);color:var(--mu)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:8px;color:var(--tx)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}.itile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1.5px solid var(--ln);background:var(--bg2)}.itile img{width:100%;height:100%;object-fit:cover}

const safeUrl=u=>{try{const x=new URL(String(u||''));return x.protocol==='https:'?x.href:''}catch{return''}};
